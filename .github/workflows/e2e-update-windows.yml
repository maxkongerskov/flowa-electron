# No secrets. Builds two slim assisted NSIS installers (no Whisper weights),
# installs 9.9.0 per-user with /S /currentuser, serves 9.9.1 on localhost, and
# requires that 9.9.0 quits within 20s of "installing" and that 9.9.1 starts
# on its own. NSIS relaunches without the test environment; the e2e build
# restores it from %APPDATA%\Flowa-Electron-e2e\e2e.json. Release builds are
# still produced on the Mac with scripts/release.sh.
name: Windows update rehearsal

on:
  workflow_dispatch:
  pull_request:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/e2e-update.mjs
