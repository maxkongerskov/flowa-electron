# Install the published v1.2.3 artifacts and update them to this branch's 1.2.4.
# The feed is local and signed with a throwaway key. The release update private
# key is not used. Windows also runs an 8-minute CPU transcription through the
# packaged 1.2.3 app and through this branch's packaged app.
name: Real 1.2.3 to PR7 update

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/real-update-pr7-5937

permissions:
  contents: read

concurrency:
  group: real-update-pr7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skipped:
    name: Rehearsal skipped by owner
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Owner stopped the real-update rehearsal
        run: echo "Real 1.2.3 to PR7 update was stopped before completion. No installers were updated."
