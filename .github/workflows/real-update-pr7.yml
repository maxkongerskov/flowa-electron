# Install the published v1.2.3 artifacts and update them to this branch's 1.2.4.
# The feed is local and signed with a throwaway key. The release update private
# key is not used. Windows also runs an 8-minute CPU transcription through the
# packaged 1.2.3 app and through this branch's packaged app.
name: Real 1.2.3 to PR7 update

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/real-update-pr7-5937

permissions:
  contents: read

concurrency:
  group: real-update-pr7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Display, AppImage, and squashfs tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libfuse2 squashfs-tools
      - run: npm ci
      - name: Update published 1.2.3 AppImage and deb
        run: node scripts/real-update-pr7.mjs
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          REAL_UPDATE_TARGETS: appimage,deb

  windows:
    name: Windows NSIS and long dictation
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update published 1.2.3 NSIS and transcribe for 8 minutes
        run: node scripts/real-update-pr7.mjs
        env:
          REAL_UPDATE_TARGETS: nsis
